<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Disable browser viewport zoom (pinch / double-tap) so mobile
         pinch gestures don't zoom the whole page. The canvas does its
         own pinch-zoom in JS (touch handlers), which is unaffected. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Graviz — GraphQL SDL visualizer</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <!-- theme-color / apple meta are inert to the bundler (no href). -->
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Graviz" />
    <script>
      // PWA wiring. The manifest / apple-touch-icon links are injected
      // at runtime rather than written in the HTML because Bun's HTML
      // bundler tries (and fails) to resolve absolute-path <link href>
      // at build time. These files are served verbatim at fixed root
      // URLs (see index.ts routes, build.ts copy step).
      (function () {
        function link(rel, href) {
          var el = document.createElement("link");
          el.rel = rel;
          el.href = href;
          document.head.appendChild(el);
        }
        link("manifest", "/manifest.webmanifest");
        link("apple-touch-icon", "/icon-192.png");
        // Register the service worker for offline / installable PWA.
        // Skip localhost so Bun's HMR and the e2e suite aren't served
        // stale, SW-cached assets during development — unless a test
        // opts in via localStorage("pwa:sw") === "force".
        if (!("serviceWorker" in navigator)) return;
        var forced = false;
        try { forced = localStorage.getItem("pwa:sw") === "force"; } catch (e) {}
        var h = location.hostname;
        if (!forced && (h === "localhost" || h === "127.0.0.1" || h === "[::1]")) return;

        // Show a dismissible "new version" toast that reloads on demand.
        function showUpdateToast(waiting) {
          if (document.getElementById("pwa-update-toast")) return;
          var bar = document.createElement("div");
          bar.id = "pwa-update-toast";
          bar.setAttribute("role", "status");
          bar.style.cssText =
            "position:fixed;left:50%;transform:translateX(-50%);" +
            "bottom:calc(16px + env(safe-area-inset-bottom));z-index:2147483647;" +
            "display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;" +
            "border-radius:12px;font:500 14px/1.2 system-ui,-apple-system,sans-serif;" +
            "box-shadow:0 8px 30px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);" +
            "background:#0b0f19;color:#f1f5f9;max-width:calc(100vw - 24px);";
          var msg = document.createElement("span");
          msg.textContent = "새 버전이 있습니다";
          var btn = document.createElement("button");
          btn.textContent = "새로고침";
          btn.style.cssText =
            "cursor:pointer;border:0;border-radius:8px;padding:6px 12px;" +
            "font:inherit;font-weight:600;background:#6366f1;color:#fff;";
          btn.addEventListener("click", function () {
            btn.disabled = true;
            btn.textContent = "적용 중…";
            // Tell the waiting worker to take over; controllerchange then reloads.
            if (waiting) waiting.postMessage({ type: "SKIP_WAITING" });
          });
          bar.appendChild(msg);
          bar.appendChild(btn);
          document.body.appendChild(bar);
        }

        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").then(function (reg) {
            // A worker already waiting from a previous visit.
            if (reg.waiting && navigator.serviceWorker.controller) showUpdateToast(reg.waiting);
            // A new worker started installing → prompt once it's ready.
            reg.addEventListener("updatefound", function () {
              var installing = reg.installing;
              if (!installing) return;
              installing.addEventListener("statechange", function () {
                if (installing.state === "installed" && navigator.serviceWorker.controller) {
                  showUpdateToast(reg.waiting || installing);
                }
              });
            });
            // Long-open tabs: re-check for a new deploy when refocused.
            document.addEventListener("visibilitychange", function () {
              if (document.visibilityState === "visible") reg.update().catch(function () {});
            });
          }).catch(function () {});

          // The new worker activated (after SKIP_WAITING) → reload once.
          var reloaded = false;
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          });
        });
      })();
    </script>
    <script>
      // Apply dark class before first paint to prevent white flash.
      // Runs synchronously in <head>, before any CSS or React loads.
      (function(){
        try {
          var t = localStorage.getItem("gompassql:theme");
          var dark = t === "dark" || (!t && (!window.matchMedia || window.matchMedia("(prefers-color-scheme:dark)").matches));
          if (t !== "light" && dark) document.documentElement.classList.add("dark");
        } catch(e){}
      })();
    </script>
    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
