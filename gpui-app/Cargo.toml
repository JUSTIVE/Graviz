[workspace]
members = ["core"]

[package]
name = "graviz"
version = "0.2.0"
edition = "2021"

[dependencies]
# Pinned to the rev gpui-metro builds against: cargo treats two revs of the
# same repo as different gpui crates, so the two must match.
gpui = { git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
# font-kit is NOT in gpui_platform's default features — without it macOS falls
# back to a placeholder text system that lays out text but renders no glyphs.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d", features = ["font-kit", "runtime_shaders"] }
graviz-core = { path = "core" }
gpui-metro = { git = "https://github.com/JUSTIVE/gpui-metro", rev = "a5596eb2fdbf69b5628d3529af198b0433684b98" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Update check only — one blocking GET to the GitHub API on startup, so a
# small synchronous client beats pulling in an async HTTP stack.
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
